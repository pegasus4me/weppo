services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: weppo
      POSTGRES_USER: weppo
      POSTGRES_PASSWORD: weppo
    ports:
      - "5433:5432"
    volumes:
      - weppo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weppo -d weppo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weppo_postgres_data:
